<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
<title>Study Quest Overlay</title>
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/>
      </symbol>
      <symbol id="i-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 4h6v6M20 4l-7.5 7.5M10 20H4v-6M4 20l7.5-7.5"/>
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 5.5v13M5.5 12h13"/>
      </symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2.4" fill="currentColor"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="m5.5 12.5 4.2 4.2 8.8-9.4"/>
      </symbol>
      <symbol id="i-sparkles" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3.5c.7 3.9 1.9 5.1 5.8 5.8-3.9.7-5.1 1.9-5.8 5.8-.7-3.9-1.9-5.1-5.8-5.8 3.9-.7 5.1-1.9 5.8-5.8Z"/>
        <path d="M18.5 14.5c.3 1.8.9 2.4 2.7 2.7-1.8.3-2.4.9-2.7 2.7-.3-1.8-.9-2.4-2.7-2.7 1.8-.3 2.4-.9 2.7-2.7Z"/>
      </symbol>
    </defs>
  </svg>

  <div class="overlay-card">
    <header class="drag-bar" id="dragBar">
      <span class="mini-logo" aria-hidden="true"></span>
      <span class="ov-brand">Study Quest</span>
      <span class="dot" id="statusDot" title="Timer status"></span>
      <span class="ov-state" id="statusText">Idle</span>
      <span class="ov-spacer"></span>
      <button class="mini-btn" id="btnDash" title="Open dashboard" aria-label="Open dashboard">
        <svg class="icon icon-sm" aria-hidden="true"><use href="#i-expand"></use></svg>
      </button>
      <button class="mini-btn" id="btnClose" title="Hide overlay" aria-label="Hide overlay">
        <svg class="icon icon-sm" aria-hidden="true"><use href="#i-x"></use></svg>
      </button>
    </header>

    <div class="timer-block">
      <div class="timer-display" id="timerDisplay">00:00:00</div>
      <input type="text" id="subjectInput" class="mini-subject" placeholder="Subject (optional)"
             maxlength="60" autocomplete="off" spellcheck="false" />

      <div class="mini-goal">
        <div class="mini-goal-track">
          <div class="mini-goal-fill" id="goalFill"></div>
        </div>
        <div class="mini-goal-text" id="goalText">No goal set</div>
      </div>
    </div>

    <div class="controls">
      <button class="primary" id="btnAction"><span id="actionLabel">Start</span></button>
      <button class="mini-stop" id="btnStop" disabled title="Stop and save" aria-label="Stop and save">
        <svg class="icon icon-sm" aria-hidden="true"><use href="#i-stop"></use></svg>
      </button>
    </div>

    <div class="mini-todo">
      <div class="mini-todo-head">
        <span>Missions</span>
        <span id="miniTodoMeta">0 left</span>
      </div>
      <ul id="miniTodoList"></ul>
      <form class="mini-add-row" id="miniTodoForm" autocomplete="off">
        <input type="text" id="miniTodoInput" placeholder="Quick add a mission..." maxlength="200" />
        <button type="submit" id="miniAddBtn" title="Add mission" aria-label="Add mission">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-plus"></use></svg>
        </button>
      </form>
    </div>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
